server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # ── LavaSrc: Spotify, Apple Music, Deezer ──
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.4.0"
      repository: "https://maven.lavalink.dev/releases"
    # ── YouTube Source (substitui o padrão) ────
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "vampypassword"
    sources:
      youtube: false        # desabilitado — usamos o plugin youtube-plugin abaixo
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  # ── YouTube plugin (sem bot-detection) ────────
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC      # YouTube Music — melhor qualidade
      - WEB        # YouTube Web
      - ANDROID    # fallback
      - IOS        # fallback extra
    # Se tiver cookies do YouTube, descomente abaixo:
    # pot:
    #   token: ""
    #   visitorData: ""

  # ── LavaSrc (Spotify, Apple Music, Deezer) ────
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""   # busca por ISRC primeiro (mais preciso)
      - "ytsearch:%QUERY%"       # busca por nome como fallback
    sources:
      spotify: true
      applemusic: false          # requer token da Apple — desabilitado por padrão
      deezer: false              # requer chave mestra — desabilitado por padrão
      yandexmusic: false
      flowerytts: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:cole_aqui_seu_client_id}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:cole_aqui_seu_client_secret}"
      countryCode: "BR"
      playlistLoadLimit: 6      # páginas de 100 tracks
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
