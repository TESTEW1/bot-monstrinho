version: "3.8"

services:

  # ══════════════════════════════════════════
  # 🎵 LAVALINK — Servidor de áudio
  # ══════════════════════════════════════════
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: vampy_lavalink
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - ./plugins:/opt/Lavalink/plugins   # pasta onde o LavaSrc é baixado
    ports:
      - "2333:2333"
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=vampypassword
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    networks:
      - vampy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════
  # 🦇 VAMPY BOT — Discord bot
  # ══════════════════════════════════════════
  vampy:
    build: .
    container_name: vampy_bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro   # opcional, mas recomendado
    environment:
      - LAVALINK_URI=http://lavalink:2333
      - LAVALINK_PASSWORD=vampypassword
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    networks:
      - vampy_net

networks:
  vampy_net:
    driver: bridge
